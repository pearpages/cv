  <!--
    One theme-color, not a media-scoped pair. A media-scoped meta cannot
    follow the `data-theme` attribute the toggle sets, so the pair could only
    ever describe the OS preference. The script below keeps this one in step
    with whichever scheme actually renders; nothing is lost by collapsing them
    because <body> is a single empty div — there is no no-JS rendering to
    preserve. Light is the ultramarine hero, which is what sits under the
    browser chrome at the top of the page; dark is the document surface.
  -->
  <meta name="theme-color" content="#1e2ed6">
  <script>
    // Blocking, and early: this has to stamp <html> before the stylesheet is
    // parsed or the wrong scheme paints for a frame. It is deliberately a
    // duplicate of the resolution in src/hooks/useTheme.ts — that module is
    // bundled and cannot run this early, and this cannot be bundled without
    // losing the property that makes it work.
    (function () {
      var stored = null;
      try {
        stored = localStorage.getItem('perepages-theme');
      } catch (error) {
        // Storage access throws outright in some privacy modes.
      }
      if (stored === 'light' || stored === 'dark') {
        document.documentElement.dataset.theme = stored;
      } else {
        stored = null;
      }
      var dark = stored
        ? stored === 'dark'
        : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document
        .querySelector('meta[name="theme-color"]')
        .setAttribute('content', dark ? '#090b11' : '#1e2ed6');
    })();
  </script>
  <meta name="apple-mobile-web-app-capable" content="yes">

  <!--
    A CV has exactly one search query to win: this person's name. The Person
    schema is what lets Google answer it with a knowledge panel rather than a
    blue link.

    %KNOWS_ABOUT% is filled at build time from `skillGroups` by the plugin in
    vite.config.ts, so the machine-readable claims cannot drift from the ones
    on the page. Hand-maintained, this list had already drifted both ways.
  -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Pere Pages Soms",
    "givenName": "Pere",
    "familyName": "Pages Soms",
    "jobTitle": "Frontend Architect & Engineering Lead",
    "description": "Frontend architect and engineering lead building production web applications since 2007, and at Ocado Technology since 2019 in React and TypeScript.",
    "url": "https://perepages.com/",
    "email": "mailto:hello@pearpages.com",
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "Barcelona",
      "addressCountry": "ES"
    },
    "knowsLanguage": ["ca", "es", "en"],
    "knowsAbout": %KNOWS_ABOUT%,
    "alumniOf": [
      {
        "@type": "CollegeOrUniversity",
        "name": "Universitat Oberta de Catalunya",
        "url": "http://www.uoc.edu/portal/en/index.html"
      },
      {
        "@type": "CollegeOrUniversity",
        "name": "University of Sheffield",
        "url": "https://www.sheffield.ac.uk/"
      }
    ],
    "worksFor": {
      "@type": "Organization",
      "name": "Ocado Technology",
      "url": "https://www.ocadogroup.com/"
    },
    "sameAs": [
      "https://github.com/pearpages",
      "https://www.linkedin.com/in/pearpages/",
      "https://stackoverflow.com/users/3955722/pere-pages",
      "https://pearpages.com",
      "https://twitter.com/pearpages"
    ]
  }
  </script>

  <script>
    // The old site registered a service worker that cached everything. The
    // current one exists only to unregister itself and flush that cache —
    // without this, returning visitors would be served the 2017 bundle.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js');
      });
    }
  </script>
